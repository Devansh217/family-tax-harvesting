name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekdays 23:30 IST, after NSE/BSE bhavcopies (~18:00) and AMFI NAVs (~23:00) are out: refreshes closing prices.
  schedule:
    - cron: '0 18 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Closing prices: fetch the latest bhavcopies and NAVs, and carry yesterday's file over from the live site.
      - name: Closing prices
        run: |
          px="$RUNNER_TEMP/prices"
          bash scripts/fetch-prices.sh "$px"
          curl -sfL "${{ steps.pages.outputs.base_url }}/prices/latest.json" -o "$px/prev-latest.json" || true
          curl -sfL "${{ steps.pages.outputs.base_url }}/prices/previous.json" -o "$px/prev-previous.json" || true
          curl -sfL "${{ steps.pages.outputs.base_url }}/prices/funds.json" -o "$px/prev-funds.json" || true
          curl -sfL "${{ steps.pages.outputs.base_url }}/prices/shares.json" -o "$px/prev-shares.json" || true
          npx vite-node scripts/build-prices.ts "$px" dist
      # The app at the site root. The old single-file v0.1 is no longer published: it shared this origin with the
      # encrypted browser copy and had no Content Security Policy (secure storage spec §5.7). Its source stays in the repo.
      - run: |
          mkdir -p ../_site
          cp -r dist/. ../_site/
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
